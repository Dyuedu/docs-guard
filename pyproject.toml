[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-guard"
version = "0.1.0"
description = "Invoice tampering localization + OCR/KIE, optimized with ONNX/TensorRT and served on Triton"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "torch-pruning>=1.3", "mlflow>=2.10"]
export = ["onnx>=1.15", "onnxruntime-gpu>=1.17", "onnxconverter-common>=1.14"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "tritonclient[grpc]>=2.42"]
dev = ["pytest>=8.0", "httpx>=0.27", "locust>=2.24", "fastapi>=0.110", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
