# CAT-Net-lite (MobileNetV3 RGB branch + fixed-DCT branch). See plan §2.3.
model: catnet_lite
seed: 42
data:
  root: data/tamper      # output of scripts/make_tamper_dataset.py ({split}/images, masks, index.jsonl)
  patch_size: 512        # must match configs/pipeline.yaml tampering.patch_size
  stride: 384
  positive_patch_ratio: 0.5
train:
  epochs: 60
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  num_workers: 8
  pos_weight: 5.0
  loss_weights: {bce: 1.0, dice: 1.0}
  init: null             # optional DocTamper-pretrained checkpoint
model_args:
  pretrained_rgb: true
  dct_clip: 20
  use_srm: false         # ablation
out_dir: artifacts/train/tamper_seg
mlflow_experiment: tamper_seg
